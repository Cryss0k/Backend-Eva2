{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="mb-4">
    <a href="{% url 'inicio:home' %}" class="btn btn-secondary">&larr; Volver a los temas</a>
</div>
<h2 class="text-center mb-4">Imágenes del Tema Seleccionado</h2>

<!-- Carrusel de Bootstrap con tamaño controlado -->
<div id="carruselTemas" class="carousel slide shadow mx-auto" data-bs-ride="carousel" style="max-width: 600px; border-radius: 10px; overflow: hidden;">
    <div class="carousel-inner">
        {% if tema_id == 1 %}
            <div class="carousel-item active">
                <img src="{% static 'images/tema1_1.jpg' %}" class="d-block w-100" style="height: 400px; object-fit: cover;" alt="Imagen 1 Tema 1">
            </div>
            <div class="carousel-item">
                <img src="{% static 'images/tema1_2.jpg' %}" class="d-block w-100" style="height: 400px; object-fit: cover;" alt="Imagen 2 Tema 1">
            </div>
        {% elif tema_id == 2 %}
            <div class="carousel-item active">
                <img src="{% static 'images/tema2_1.jpg' %}" class="d-block w-100" style="height: 400px; object-fit: cover;" alt="Imagen 1 Tema 2">
            </div>
            <div class="carousel-item">
                <img src="{% static 'images/tema2_2.jpg' %}" class="d-block w-100" style="height: 400px; object-fit: cover;" alt="Imagen 2 Tema 2">
            </div>
        {% endif %}
    </div>
    
    <!-- Controles del Carrusel -->
    <button class="carousel-control-prev" type="button" data-bs-target="#carruselTemas" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carruselTemas" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
    </button>
</div>
{% endblock %}
